<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Store 6 - team kit assistant</title>
<link rel="stylesheet" href="/static/zar.css?v=r3-final">
<style>
/* Store 6 brand skin over the shared chat component */
:root{--bg:#ffffff;--bg2:#f5f6f8;--panel:#ffffff;--panel2:#f1f2f5;--line:#e5e7ec;--line2:#d6d9e0;--text:#101828;--muted:#5b6474;--dim:#8a93a3;--gold:#f5b82e;--link:#1d4ed8}
body{display:flex;flex-direction:column;height:100vh;background:#fff}
.hd{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#101828;color:#fff}
.hd .m{width:30px;height:30px;border-radius:8px;background:#f5b82e;color:#101828;display:grid;place-items:center;font-weight:800}
.hd b{display:block;font-size:14px}.hd span{font-size:11.5px;color:#c9cfdb}
.msg.customer{background:#101828;color:#fff;border:0}.msg.assistant{background:#f1f2f5}
button.primary{background:#101828;border-color:#101828;color:#fff}button.primary:hover{background:#1f2a44}
.proof img{background:#eef0f5}.s-needs_input{color:#b45309}.chip{color:#344054}
#wrap{flex:1;min-height:0}.foot{font-size:11px;color:var(--dim);text-align:center;padding:6px;border-top:1px solid var(--line)}
.sum{padding:8px 14px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);display:none}
</style>
</head>
<body>
<div class="hd"><div class="m">6</div><div><b>Store 6 team kits</b><span>Assistant powered by ZAR Intelligence</span></div></div>
<div class="sum" id="sum"></div>
<div id="wrap"></div>
<div class="foot">Your logo is used only for your proofs. Prices come from Store 6's price list.</div>
<script src="/static/common.js?v=r3-final"></script><script src="/static/chat.js?v=r3-final"></script>
<script>
(function (Z) {
  const q = new URLSearchParams(location.search), tenant = q.get("tenant") || "store6", KEY = `zar_session_${tenant}`;
  const sum = document.getElementById("sum");
  const chat = new Z.Chat(document.getElementById("wrap"), { tenant, onUpdate: s => {
    try { s ? localStorage.setItem(KEY, s.session_id) : localStorage.removeItem(KEY); } catch (e) {}
    const qq = s?.quote?.quote, sp = s?.spec;
    sum.style.display = sp?.garment_type ? "block" : "none";
    sum.textContent = sp?.garment_type ? `${sp.quantity || "?"} × ${sp.garment_type}${sp.deadline ? " · by " + sp.deadline : ""}${qq ? " · " + Z.money(qq.total, qq.currency) : ""} · ${Z.stateLabel(s.state)}` : "";
  }});
  Z.api(`/v1/tenants/${tenant}`).then(t => { chat.greeting = t.widget.greeting; if (!chat.session) chat.render(); }).catch(() => {});
  let saved = null; try { saved = q.get("session") || localStorage.getItem(KEY); } catch (e) {}
  if (saved) chat.load(saved);
  setInterval(async () => {                       // pick up roster progress made by team members
    if (!chat.session || chat.busy || !["collecting", "awaiting_confirmation"].includes(chat.session.state)) return;
    const s = await Z.api(`/v1/sessions/${chat.session.session_id}`).catch(() => null);
    if (s && s.rev !== chat.session.rev) { chat.session = s; chat.render(); chat.onUpdate(s); }
  }, 3000);
  window.addEventListener("message", e => { if (e.data?.type === "zar:prefill" && !chat.session) { const t = document.getElementById("brief"); if (t) t.value = e.data.brief || ""; } });
})(window.ZAR);
</script>
</body>
</html>
