# First matching rule wins. Facts: fabric, gradient, colour_count, fine_text, quantity.
fabric_methods:
  polyester: [sublimation, screen, dtf]
  cotton: [screen, dtf]
exclusions:          # a method is not allowed when ANY listed condition holds
  screen:
    - {field: gradient, op: eq, value: true}
    - {field: colour_count, op: gt, value: 6}
    - {field: fine_text, op: eq, value: true}
rules:
  - id: P1-gradient-polyester
    when: [{field: fabric, op: eq, value: polyester}, {field: gradient, op: eq, value: true}]
    then: sublimation
    reason: Gradient or photographic artwork on polyester prints most faithfully with sublimation.
  - id: P2-multicolour-polyester
    when: [{field: fabric, op: eq, value: polyester}, {field: colour_count, op: gt, value: 3}]
    then: sublimation
    reason: More than three colours on polyester - sublimation avoids per-colour screens.
  - id: P3-gradient-cotton
    when: [{field: gradient, op: eq, value: true}]
    then: dtf
    reason: Gradients on cotton cannot be sublimated; DTF reproduces them.
  - id: P4-flat-bulk
    when: [{field: colour_count, op: lte, value: 3}, {field: quantity, op: gte, value: 25}, {field: fine_text, op: eq, value: false}]
    then: screen
    reason: Flat artwork with three or fewer colours at 25+ pieces is cheapest and most durable as screen print.
default: dtf
default_reason: Small runs or fine detail - DTF needs no screens and keeps detail.
